{% extends "base.html" %}
{% block title %}Log Ministry Activity{% endblock %}

{% block content %}
<div class="mb-4">
    <h3 class="fw-bold mb-1">Log Ministry Activity</h3>
</div>

<div class="card border-0 shadow-sm" style="max-width: 680px;">
    <div class="card-body p-4">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Ministry *</label>
                    {{ form.ministry }}
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Activity Date *</label>
                    {{ form.activity_date }}
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Activity Title *</label>
                    {{ form.title }}
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Location / Venue</label>
                    {{ form.location }}
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Attendance Count</label>
                    {{ form.attendance_count }}
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Notes / Summary</label>
                    {{ form.notes }}
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Activity</button>
                <a href="{% url 'ministries:list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
